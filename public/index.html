<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4e7ea">
  <title>Grab Lab — Arcade de garra</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
  <script type="module" src="/screen.js"></script>
</head>
<body class="kiosk">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Grab Lab, inicio"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M14 4v6m-4 0h8l2 5m-8-5-2 5m8-5 4 4 1 5-4 4m-9-13-4 4-1 5 4 4m5-13v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="10" r="1" fill="currentColor"/></svg></span><span>GRAB<span class="brand-accent">LAB</span><small>ARCADE SYSTEMS</small></span></a>
    <div class="top-actions"><span class="machine-id"><i></i> MÁQUINA 01</span><button id="fullscreen" class="icon-button" aria-pressed="false" aria-label="Pantalla completa" title="Pantalla completa"><svg viewBox="0 0 24 24" fill="none"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </header>
  <main class="layout">
    <section class="machine" id="machine" aria-label="Máquina de garra">
      <div class="glass">
        <canvas id="arena" tabindex="-1" width="1000" height="555" role="img" aria-label="Máquina en perspectiva con una garra mecánica y pelotas de colores"></canvas>
        <div class="glass-label"><i></i> <span id="machine-status">INICIANDO</span></div>
      </div>
      <div class="result" id="result" hidden>
        <div class="result-card" role="dialog" aria-labelledby="result-title">
          <img id="result-ball" alt="" hidden>
          <div class="eyebrow" id="result-label"></div>
          <h2 id="result-title"></h2>
          <p id="result-description"></p>
          <button id="replay" class="main-button">Volver a jugar <span aria-hidden="true">↻</span></button>
        </div>
      </div>
      <div class="pair-overlay" id="pair-overlay" hidden>
        <a id="open-control" class="qr-link" aria-label="Abrir joystick" target="_blank" rel="noopener">
          <img id="qr" alt="">
        </a>
      </div>
    </section>
  </main>
  <footer>
    <div class="keyboard"><div><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span>Mover</span></div><div><kbd>ESPACIO</kbd><span>Soltar</span></div></div>
    <span id="connection" role="status"><i></i> Conectando</span>
  </footer>
</body>
</html>
